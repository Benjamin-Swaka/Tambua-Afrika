{% extends 'dashboard_base.html' %}
{% block dashboard_content %}

<div class="mb-4">
    <h2 class="h4 mb-0 fw-bold">Remove this FAQ?</h2>
    <p class="text-muted small mb-0">This action cannot be undone.</p>
</div>

<div class="card border-0 shadow-sm" style="max-width: 680px;">
    <div class="card-body p-4">
        <div class="alert alert-warning border-0">
            <strong>{{ faq.question }}</strong>
            <p class="mb-0 mt-1">{{ faq.answer|truncatewords:30 }}</p>
        </div>

        <form method="post">
            {% csrf_token %}
            <div class="d-flex align-items-center gap-3 mt-3">
                <button type="submit" class="btn btn-danger">Yes, Remove It</button>
                <a href="{% url 'admin_list' %}" class="text-muted small fw-bold">Cancel</a>
            </div>
        </form>
    </div>
</div>

{% endblock %}
