{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Tambua Afrika{% endblock %}</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'css/crowdfunding.css' %}">
    <!-- FontAwesome (if needed) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="minimal-page">

    <!-- Minimal top bar with logo only -->
    <div class="minimal-topbar">
        <div class="container">
            <a href="{% url 'home' %}" class="minimal-logo-link">
                <img src="{% static 'images/logo.png' %}" alt="Tambua Afrika" class="minimal-logo">
            </a>
        </div>
    </div>

    <!-- Main content area -->
    <main class="minimal-main">
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>

    <!-- Bootstrap JS (optional) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'JS/script.js' %}"></script>
    <script src="{% static 'JS/cookie_consent.js' %}"></script>
</body>
</html>
