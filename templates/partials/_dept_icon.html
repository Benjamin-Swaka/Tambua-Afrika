{% comment %} Renders the correct department icon. Pass: type {% endcomment %}
<svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.4">
{% if type == 'studios' %}
    <rect x="2" y="8" width="18" height="12" rx="1.5"/>
    <path d="M7 8V6a4 4 0 018 0v2" stroke-linecap="round"/>
    <line x1="11" y1="12" x2="11" y2="16" stroke-linecap="round"/>
    <line x1="9"  y1="14" x2="13" y2="14" stroke-linecap="round"/>

{% elif type == 'ink' %}
    <path d="M14 2L4 12l-1 5 5-1L18 6a2.83 2.83 0 00-4-4z" stroke-linejoin="round"/>
    <path d="M12 4l4 4"/>

{% elif type == 'stage' %}
    <circle cx="8"  cy="9" r="3"/>
    <circle cx="14" cy="9" r="3"/>
    <path d="M3 20c0-3.31 2.24-6 5-6h6c2.76 0 5 2.69 5 6" stroke-linecap="round"/>

{% elif type == 'comics' %}
    <rect x="2"  y="2"  width="8" height="8" rx="1.5"/>
    <rect x="12" y="2"  width="8" height="8" rx="1.5"/>
    <rect x="2"  y="12" width="8" height="8" rx="1.5"/>
    <rect x="12" y="12" width="8" height="8" rx="1.5"/>

{% elif type == 'sales' %}
    <path d="M11 2v18M2 11h18" stroke-linecap="round"/>
    <circle cx="11" cy="11" r="9"/>
    <path d="M7 7l3 3M14 14l3 3M7 14l3-3M14 7l3-3" stroke-linecap="round"/>

{% else %}
    <circle cx="11" cy="11" r="9"/>
{% endif %}
</svg>
