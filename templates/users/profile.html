{% extends 'dashboard_base.html' %}
{% block dashboard_content %}

<div class="row">
    <div class="col-md-8">
        <div class="card border-0 shadow-sm p-4">
            <h4 class="mb-4">Profile Settings</h4>
            
            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                
                <h6 class="text-uppercase text-muted small mb-3">Account Info</h6>
                <div class="row mb-3">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Username</label>
                        {{ u_form.username }}
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Email Address</label>
                        {{ u_form.email }}
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">First Name</label>
                        {{ u_form.first_name }}
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Last Name</label>
                        {{ u_form.last_name }}
                    </div>
                </div>

                <h6 class="text-uppercase text-muted small mb-3 mt-4">Public Profile</h6>
                <div class="mb-3">
                    <label class="form-label">Bio</label>
                    {{ p_form.bio }}
                </div>
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Location</label>
                        {{ p_form.location }}
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Profile Picture</label>
                        {{ p_form.avatar }}
                    </div>
                </div>

                <hr class="my-4">
                <button type="submit" class="btn btn-dark px-4 py-2">Save Changes</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
